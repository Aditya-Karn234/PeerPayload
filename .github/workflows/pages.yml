# Publishes the PeerPayload Connect landing page (site/) on GitHub Pages:
# https://aditya-karn234.github.io/PeerPayload/
# The logo comes from branding/, so there's one copy of it. The page reads
# the latest release and the download counts from GitHub when it loads,
# so a new release needs no change here.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "branding/connect-icon.svg"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: assemble the site
        run: |
          mkdir _site
          cp -r site/. _site/
          cp branding/connect-icon.svg _site/icon.svg

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
