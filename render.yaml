# Render Blueprint — deploys the org-tool backend + its Postgres database
# together from one file (Render's "New Blueprint" flow reads this
# automatically from the repo root).
#
# Only the backend is deployed here: it's pure HTTP + WebSocket (auth,
# presence, directory, transfer-intent bookkeeping, socket.io signaling) —
# it never spawns the engine or needs a raw TCP port, unlike the older
# personal-tool backend. The actual file transfer happens directly between
# the two desktop apps, which never touch Render at all.
services:
  - type: web
    name: orgxfer-backend
    runtime: node
    plan: free
    rootDir: backend
    # protocol/ (shared wire formats) is a file: dependency; redeploy when
    # it changes too, not only backend/.
    buildFilter:
      paths:
        - backend/**
        - protocol/**
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: orgxfer-db
          property: connectionString
      # 30 days — matches config.js's own default; set explicitly here so
      # it's visible/adjustable from the Render dashboard without a redeploy.
      - key: SESSION_TTL_MS
        value: "2592000000"
      - key: PRESENCE_TTL_MS
        value: "45000"
      # Relay for transfers whose machines can't reach each other directly.
      # The backend signs relay tickets with the relay's secret; the URL is
      # what clients connect to. If Render gives the relay a different
      # hostname (name already taken), update RELAY_URL to match.
      - key: RELAY_URL
        value: wss://orgxfer-relay.onrender.com/v1/connect
      - key: RELAY_SECRET
        fromService:
          name: orgxfer-relay
          type: web
          envVarKey: RELAY_SECRET

  # Blind WebSocket relay (relay/). A separate service so relayed file bytes
  # never compete with the API for memory, CPU or bandwidth, and so it can
  # move to a bigger plan or a VPS on its own — clients only see RELAY_URL.
  # Stateless: it verifies backend-signed tickets and needs no database.
  - type: web
    name: orgxfer-relay
    runtime: node
    plan: free
    rootDir: relay
    buildFilter:
      paths:
        - relay/**
        - protocol/**
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: RELAY_SECRET
        generateValue: true
      # Render's proxy sets X-Forwarded-For; the per-IP connection cap
      # needs the real client address, not the proxy's.
      - key: TRUST_PROXY
        value: "1"

databases:
  - name: orgxfer-db
    plan: free
    databaseName: orgxfer
    user: orgxfer
