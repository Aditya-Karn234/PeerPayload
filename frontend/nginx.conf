# Mirrors vite.config.js's dev proxy so the built app talks to /api and
# /socket.io as same-origin relative paths in production too — the frontend
# JS never needs a backend URL baked in at build time (see src/lib/api.js,
# src/lib/socket.js).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /socket.io/ {
        proxy_pass http://backend:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # React Router client-side routes (e.g. /transfers/:id) aren't real
    # files — fall back to index.html and let the SPA's router handle them.
    location / {
        try_files $uri /index.html;
    }
}
