appId: com.peerpayload.desktop
# Display name (installer, shortcuts, exe). The app's data folder comes
# from package.json "name" (peerpayload-desktop), not this, so renaming
# here keeps everyone's saved login and settings. Don't add productName
# to package.json: that would move the data folder.
productName: PeerPayload Enterprise
directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - package.json

# The C++ transfer engine binaries — sender.exe/receiver.exe are what
# actually move file bytes; without these bundled in, the installed app has
# nothing to spawn (config.js's dev-mode relative path only resolves inside
# a repo checkout, which an end user's machine never has). Landed in
# resources/engine/, read via process.resourcesPath in config.js.
extraResources:
  - from: ../build/sender/sender.exe
    to: engine/sender.exe
  - from: ../build/receiver/receiver.exe
    to: engine/receiver.exe

# electron-builder's auto-update only works with NSIS (.exe) on Windows and
# AppImage on Linux — .msi (WiX) and .deb don't support electron-updater at
# all. Settled decision: those two are the primary, auto-updating artifacts;
# .msi/.deb would be secondary IT-deployable builds if ever needed, not
# built here.
win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Network

# Generic HTTP provider, not GitHub/S3 — matches "reachable only on the
# internal network/VPN, not the public internet." Points at wherever the
# org actually hosts the update feed; this URL is a placeholder for that.
publish:
  provider: generic
  url: https://updates.internal.example.com/peerpayload/
